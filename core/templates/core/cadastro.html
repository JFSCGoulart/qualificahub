{% extends "core/base.html" %}
{% block content %}
<div class="auth-card">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#5263DE"/>
        <circle cx="50" cy="50" r="18" fill="#F7EA5C"/>
    </svg>
    <h1>Criar conta</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required minlength="6">
            <div class="form-hint">Mínimo de 6 caracteres.</div>
        </div>
        <div class="form-group">
            <label for="turma">Turma <span class="optional">(opcional)</span></label>
            <input type="text" id="turma" name="turma">
        </div>
        <div class="form-group">
            <label for="tipo">Tipo de usuário</label>
            <select id="tipo" name="tipo">
                {% for t in tipos %}
                    <option value="{{ t }}">{{ t|capfirst }}</option>
                {% endfor %}
            </select>
            <div class="form-hint">
                Coordenadores são cadastrados apenas pelo administrador.
            </div>
        </div>
        <button type="submit" class="btn btn-block btn-lg">Cadastrar</button>
    </form>
    <div class="auth-footer">
        Já tem conta? <a href="{% url 'login' %}">Entrar</a>
    </div>
</div>
{% endblock %}
