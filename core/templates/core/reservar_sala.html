{% extends "core/base.html" %}
{% block content %}
<div class="page-header">
    <h1 class="com-barra">Reservar Sala</h1>
    <p class="page-subtitle">Reserve uma sala para sua aula ou reunião.</p>
</div>

<div class="card card-mid">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="sala_id">Sala</label>
            <select id="sala_id" name="sala_id" required>
                {% for s in salas %}
                    <option value="{{ s.id }}">
                        {{ s.nome }} — {{ s.andar }}º andar ({{ s.capacidade }} lugares)
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="data">Data</label>
            <input type="date" id="data" name="data" required>
        </div>
        <div class="form-group">
            <label for="horario">Horário</label>
            <select id="horario" name="horario" required>
                {% for h in horarios %}<option value="{{ h }}">{{ h }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="motivo">Motivo <span class="optional">(opcional)</span></label>
            <input type="text" id="motivo" name="motivo"
                   placeholder="Ex: Aula de programação">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-accent">Confirmar Reserva</button>
            <a href="{% url 'minhas_reservas' %}" class="btn btn-ghost">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
